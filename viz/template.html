<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possession Viewer</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --muted: #8b95a3; --line: #2a313b;
    --grass: #1d4d2c; --grass2: #1a4628; --chalk: rgba(255,255,255,.75);
    --H: #3b82f6; --A: #ef4444; --D: #9ca3af; --X: #2a313b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px 24px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
  .boxes { display: flex; gap: 8px; margin-left: auto; }
  .box { min-width: 132px; padding: 8px 12px; border-radius: 8px; background: var(--panel);
         border: 1px solid var(--line); text-align: center; }
  .box .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .box .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .box.match { outline: 2px solid #22c55e; }
  .box.miss { outline: 2px solid #f59e0b; }
  .strips { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 8px 10px; margin-bottom: 10px; }
  .strip { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; }
  .strip + .strip { margin-top: 4px; }
  .strip span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .strip canvas { width: 100%; height: 14px; display: block; cursor: pointer; border-radius: 3px; }
  #pitch { width: 100%; display: block; border-radius: 8px; background: var(--grass); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button, select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  input[type=range] { flex: 1; min-width: 160px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px;
            margin-top: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px;
         vertical-align: -1px; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
        padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Possession viewer</h1>
    <span id="clock" style="color:var(--muted)"></span>
    <div class="boxes">
      <div class="box" id="boxPred"><div class="k">Prediction</div><div class="v" id="vPred">–</div></div>
      <div class="box" id="boxTruth"><div class="k" id="truthName">Reference</div><div class="v" id="vTruth">–</div></div>
    </div>
  </header>
  <div class="strips" id="strips"></div>
  <canvas id="pitch"></canvas>
  <div class="controls">
    <button id="play">Play</button>
    <select id="speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="8">8×</option>
    </select>
    <input type="range" id="seek" min="0" value="0">
    <button id="prevT" title="previous prediction change (P)">◀ change</button>
    <button id="nextT" title="next prediction change (N)">change ▶</button>
    <button id="nextM" title="next mismatch (M)">next mismatch</button>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--H)"></i>Home (H)</span>
    <span><i class="dot" style="background:var(--A)"></i>Away (A)</span>
    <span><i class="dot" style="background:var(--D)"></i>Dead (D)</span>
    <span><i class="dot" style="background:#fff"></i>Ball seen</span>
    <span><i class="dot" style="border:2px solid #facc15;background:transparent"></i>Ball filled (interp / follow)</span>
    <span><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> 1 frame · <kbd>Shift</kbd>+arrows 1 s · <kbd>N</kbd>/<kbd>P</kbd> change · <kbd>M</kbd> mismatch</span>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const LBL = ["H", "A", "D", "X"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = () => [css("--H"), css("--A"), css("--D"), css("--X")];
const N = DATA.frames.length;
let i = 0, playing = false, last = 0, acc = 0;

document.getElementById("title").textContent = "Possession viewer · " + DATA.name;
document.getElementById("truthName").textContent = DATA.truth_name;
const seek = document.getElementById("seek"); seek.max = N - 1;

// ---- label strips -----------------------------------------------------------------------------
const strips = [];
function addStrip(name, arr, map) {
  if (!arr) return;
  const row = document.createElement("div"); row.className = "strip";
  const lab = document.createElement("span"); lab.textContent = name;
  const c = document.createElement("canvas");
  row.append(lab, c); document.getElementById("strips").append(row);
  c.addEventListener("click", e => { const r = c.getBoundingClientRect();
    go(Math.round((e.clientX - r.left) / r.width * (N - 1))); });
  strips.push({ c, arr, map });
}
addStrip("prediction", DATA.pred, v => v);
addStrip("reference", DATA.truth, v => v);
addStrip("rule machine", DATA.rule, v => v);
addStrip("dead detector", DATA.dead, v => v ? 2 : 3);
addStrip("ball source", DATA.frames.map(f => f.s), v => [4, 5, 6, 3][v]);

function drawStrips() {
  const col = COL().concat(["#e5e7eb", "#facc15", "#a16207"]);
  for (const s of strips) {
    const w = s.c.clientWidth, h = s.c.clientHeight, dpr = devicePixelRatio || 1;
    s.c.width = w * dpr; s.c.height = h * dpr;
    const g = s.c.getContext("2d"); g.scale(dpr, dpr);
    let start = 0;
    for (let k = 1; k <= N; k++) {
      if (k === N || s.map(s.arr[k]) !== s.map(s.arr[start])) {
        g.fillStyle = col[s.map(s.arr[start])];
        g.fillRect(start / N * w, 0, Math.max((k - start) / N * w, 0.5), h);
        start = k;
      }
    }
    g.fillStyle = "#fff"; g.fillRect(i / N * w - 1, 0, 2, h);
  }
}

// ---- pitch --------------------------------------------------------------------------------------
const cv = document.getElementById("pitch"), ctx = cv.getContext("2d");
const [L, W] = DATA.pitch, PAD = 4;
let S = 8;
function resize() {
  const w = cv.clientWidth, dpr = devicePixelRatio || 1;
  S = (w - 2 * PAD * (w / (L + 2 * PAD))) / L;
  S = w / (L + 2 * PAD);
  cv.style.height = (W + 2 * PAD) * S + "px";
  cv.width = w * dpr; cv.height = (W + 2 * PAD) * S * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(); drawStrips();
}
const X0 = x => (x + PAD) * S, Y0 = y => (y + PAD) * S;
function pitchLines() {
  ctx.fillStyle = css("--grass"); ctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
  for (let k = 0; k < 10; k += 2) { ctx.fillStyle = css("--grass2");
    ctx.fillRect(X0(k * L / 10), Y0(0), L / 10 * S, W * S); }
  ctx.strokeStyle = css("--chalk"); ctx.lineWidth = 1.5;
  ctx.strokeRect(X0(0), Y0(0), L * S, W * S);
  ctx.beginPath(); ctx.moveTo(X0(L / 2), Y0(0)); ctx.lineTo(X0(L / 2), Y0(W)); ctx.stroke();
  ctx.beginPath(); ctx.arc(X0(L / 2), Y0(W / 2), 9.15 * S, 0, 2 * Math.PI); ctx.stroke();
  for (const side of [0, 1]) {
    const x = side ? L - 16.5 : 0, x6 = side ? L - 5.5 : 0;
    ctx.strokeRect(X0(x), Y0(W / 2 - 20.16), 16.5 * S, 40.32 * S);
    ctx.strokeRect(X0(x6), Y0(W / 2 - 9.16), 5.5 * S, 18.32 * S);
  }
}
function draw() {
  const f = DATA.frames[i], col = COL();
  pitchLines();
  // ball trail
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.beginPath();
  let moved = false;
  for (let k = Math.max(0, i - 25); k <= i; k++) {
    const b = DATA.frames[k].b; if (b[0] === null) { moved = false; continue; }
    if (!moved) { ctx.moveTo(X0(b[0]), Y0(b[1])); moved = true; } else ctx.lineTo(X0(b[0]), Y0(b[1]));
  }
  ctx.stroke();
  // players
  const p = f.p;
  for (let k = 0; k < DATA.team.length; k++) {
    const x = p[2 * k], y = p[2 * k + 1]; if (x === null) continue;
    ctx.fillStyle = col[DATA.team[k]];
    ctx.beginPath(); ctx.arc(X0(x), Y0(y), 0.9 * S, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1; ctx.stroke();
  }
  // ball
  if (f.b[0] !== null) {
    ctx.beginPath(); ctx.arc(X0(f.b[0]), Y0(f.b[1]), 0.55 * S, 0, 2 * Math.PI);
    if (f.s === 0) { ctx.fillStyle = "#fff"; ctx.fill(); }
    else { ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.stroke(); }
  }
  // header boxes
  const pv = DATA.pred ? DATA.pred[i] : null, tv = DATA.truth[i];
  setBox("vPred", pv); setBox("vTruth", tv);
  const bp = document.getElementById("boxPred");
  bp.classList.toggle("match", pv !== null && tv !== 3 && pv === tv);
  bp.classList.toggle("miss", pv !== null && tv !== 3 && pv !== tv);
  const fr = DATA.idx[i], s = Math.floor(fr / 25);
  document.getElementById("clock").textContent =
    "frame " + fr + " · " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  seek.value = i;
}
function setBox(id, v) {
  const el = document.getElementById(id);
  if (v === null) { el.textContent = "–"; el.style.color = ""; return; }
  el.textContent = LBL[v]; el.style.color = v === 3 ? css("--muted") : COL()[v];
}

// ---- navigation -------------------------------------------------------------------------------
function go(k) { i = Math.max(0, Math.min(N - 1, k)); draw(); drawStrips(); }
function findNext(pred, dir) { for (let k = i + dir; k >= 0 && k < N; k += dir) if (pred(k)) return k; return i; }
const changed = k => DATA.pred && k > 0 && DATA.pred[k] !== DATA.pred[k - 1];
const mismatch = k => DATA.pred && DATA.truth[k] !== 3 && DATA.pred[k] !== DATA.truth[k] &&
  !(DATA.pred[k - 1] !== DATA.truth[k - 1] && k > 0);
document.getElementById("nextT").onclick = () => go(findNext(changed, 1));
document.getElementById("prevT").onclick = () => go(findNext(changed, -1));
document.getElementById("nextM").onclick = () => go(findNext(mismatch, 1));
seek.oninput = () => go(+seek.value);
const playBtn = document.getElementById("play");
function toggle() { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; last = performance.now(); acc = 0;
  if (playing) requestAnimationFrame(tick); }
playBtn.onclick = toggle;
function tick(now) {
  if (!playing) return;
  acc += (now - last) / 1000 * DATA.fps * +document.getElementById("speed").value; last = now;
  const adv = Math.floor(acc); if (adv) { acc -= adv; go(i + adv); if (i >= N - 1) toggle(); }
  requestAnimationFrame(tick);
}
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") go(i + (e.shiftKey ? Math.round(DATA.fps) : 1));
  else if (e.key === "ArrowLeft") go(i - (e.shiftKey ? Math.round(DATA.fps) : 1));
  else if (e.key === "n" || e.key === "N") go(findNext(changed, 1));
  else if (e.key === "p" || e.key === "P") go(findNext(changed, -1));
  else if (e.key === "m" || e.key === "M") go(findNext(mismatch, 1));
});
addEventListener("resize", resize);
resize();
</script>
</body>
</html>
